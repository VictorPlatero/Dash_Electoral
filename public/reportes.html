<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reportes electorales de Tacna</title>
<style>
body{font:1rem system-ui;background:#f5f7fa;color:#18222d;margin:0}main{max-width:1100px;margin:auto;padding:24px}a{color:#065d70}form,section{background:white;border:1px solid #d9e0e5;border-radius:6px;padding:16px;margin:16px 0}form{display:flex;flex-wrap:wrap;gap:12px}label{display:grid;gap:4px}select{font:inherit;padding:6px;max-width:100%}h2{font-size:1.15rem} .tabla{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}td,th{padding:8px;border-bottom:1px solid #d9e0e5}meter{width:100%;accent-color:#087e83}
</style>
<style>
.timeline{border-top:3px solid #087e83}.timeline h2{margin:0 0 12px}.timeline-track{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px}.timeline button{flex:none;background:#eef5f5;border:1px solid #9dbfc0;border-radius:6px;color:#143237;cursor:pointer;font:inherit;padding:8px 12px}.timeline button[aria-pressed="true"]{background:#075961;color:white;border-color:#075961}.timeline button:focus-visible{outline:2px solid #ab5b12;outline-offset:2px}.timeline button small{display:block;margin-top:2px}
</style>
<main>
<a href="./">Volver al dashboard</a>
<h1>Reportes electorales de Tacna</h1>
<form id="filtros" aria-label="Filtros de reportes"></form>
<section class="timeline" aria-labelledby="timeline-title">
  <h2 id="timeline-title">Línea de tiempo electoral</h2>
  <div id="timeline" class="timeline-track"></div>
</section>
<p id="estado" role="status"></p>
<nav aria-label="Índice de reportes">
  <h2>6 reportes electorales</h2>
  <ol id="indice-reportes"></ol>
</nav>
<div id="reportes"></div>
</main>
<script type="module" src="reportes.js"></script>
</html>
